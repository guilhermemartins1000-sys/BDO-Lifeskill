function money(x){
  const n=Math.round(+x||0);
  if(!n)return "0";
  const sign=n<0?"-":"", a=Math.abs(n);
  const fmt=v=>v.toFixed(2).replace(".",",");
  if(a>=1000000000)return sign+fmt(a/1000000000)+"B";
  if(a>=1000000)return sign+fmt(a/1000000)+"M";
  if(a>=1000)return sign+fmt(a/1000)+"K";
  return sign+a.toLocaleString("pt-BR");
}

function normalizeV2(arr){

    if(Number(x.sid||0)!==0 && out[x.id])continue;
    out[x.id]={
      base:Number(x.basePrice||0),
      stock:Number(x.currentStock||0),
      trades:Number(x.totalTrades||0),
      min:Number(x.priceMin||0),

async function loadDashboardMarket(){
  try{
    // O Dashboard usa os mesmos preços já carregados pelo lote principal como
    // base imediata. Assim ele nunca fica 0/x enquanto a consulta exclusiva
    // do Dashboard ainda está respondendo ou quando o servidor retorna uma
    // estrutura diferente. A consulta /dashboard apenas complementa estoque
    // e dados específicos.
    S.dashboardPrices=S.dashboardPrices||{};
    for(const [name,id] of Object.entries(DATA.priceIds||{})){
      const base=S.prices[name];
      if(base && (base.last||base.min||base.max||base.base)){
        S.dashboardPrices[name]={...base,name,id:Number(id)};
      }
    }
    const ids=Object.values(DATA.priceIds||{}).filter(Boolean);
    const data=await marketFetch('/dashboard?ids='+encodeURIComponent([...new Set(ids)].join(',')));
    if(data && typeof data==='object' && !Array.isArray(data)){
      // /api/dashboard retorna os registros pelo ID. A versão anterior esperava
      // que o servidor também enviasse `name`, por isso o Dashboard mostrava
      // 0/115 mesmo quando os 115 preços já haviam sido recebidos.
      // Não zerar o cache/base que veio do lote principal.
      // A consulta exclusiva só substitui/complementa os itens que retornar.
      const baseDashboard={...S.dashboardPrices};
      S.dashboardPrices=baseDashboard;
      const idToName={};
      for(const [name,id] of Object.entries(DATA.priceIds||{})) idToName[String(id)]=name;
      for(const p of (data.items||[])){
        if(!p) continue;
        const name=p.name||idToName[String(p.id)];
        if(name) S.dashboardPrices[name]={...p,name};
      }
      S.dashboardAt=new Date().toLocaleString('pt-BR');
      trackMarketDemand(Object.keys(DATA.priceIds||{}));

    }

    if(page==='home') home(false);
  }
}
function marketStats(name){
  const p=dashboardPrice(name)||{}, base=S.prices[name]||{};
  const price=Number(p.last??p.lastSoldPrice??base.last??base.lastSoldPrice??p.max??base.max??DATA.refs?.[name]??0);
  const min=Number(p.min??p.priceMin??base.min??base.priceMin??0);
  const max=Number(p.max??p.priceMax??base.max??base.priceMax??0);
  const stockKnown=p.stockKnown===true||base.stockKnown===true;
  const stock=stockKnown?Number(p.currentStock??p.stock??base.currentStock??base.stock??0):null;
  const trades=Number(p.trades??p.totalTrades??base.trades??base.totalTrades??0);
  const hist=(S.history?.[name]||[]).filter(v=>Number(v)>0).map(Number);
  const first=hist.length?hist[Math.max(0,hist.length-7)]:0,last=hist.length?hist[hist.length-1]:price;
  const price7d=first>0&&last>0?((last-first)/first)*100:null;
  const sales=S.salesHistory?.[name]||[];
  const now=Date.now(),cutoff=now-7*86400000,prevCutoff=now-14*86400000;
  const demand7d=sales.filter(v=>new Date(v.date+'T23:59:59').getTime()>=cutoff).reduce((a,v)=>a+Number(v.delta||0),0);
  const demandPrev7d=sales.filter(v=>{const t=new Date(v.date+'T23:59:59').getTime();return t>=prevCutoff&&t<cutoff}).reduce((a,v)=>a+Number(v.delta||0),0);
  const demandKnown=sales.some(v=>new Date(v.date+'T23:59:59').getTime()>=cutoff);
  const demandVar=demandKnown&&demandPrev7d>0?((demand7d-demandPrev7d)/demandPrev7d)*100:null;
  return {price,min,max,stockKnown,stock,trades,hist,price7d,demand:demandKnown?demand7d:null,demandVar,source:p.source||base.source||'Mercado SA'};
}
function trackMarketDemand(names){
  S.salesHistory=S.salesHistory||{}; S.salesSnapshot=S.salesSnapshot||{};
  const today=new Date().toISOString().slice(0,10);
  for(const name of names){
    const p=dashboardPrice(name)||S.prices?.[name]||{};
    const trades=Number(p.trades??p.totalTrades??0);
    if(!trades) continue;
    const prev=S.salesSnapshot[name];
    if(prev && Number(prev.trades)>0 && trades>=Number(prev.trades)){
      const delta=trades-Number(prev.trades);
      if(delta>0){
        S.salesHistory[name]=Array.isArray(S.salesHistory[name])?S.salesHistory[name]:[];
        const arr=S.salesHistory[name]; const row=arr.find(v=>v.date===today);
        if(row) row.delta=Number(row.delta||0)+delta; else arr.push({date:today,delta});
        S.salesHistory[name]=arr.filter(v=>Date.parse(v.date+'T23:59:59')>=Date.now()-30*86400000);
      }
    }
    S.salesSnapshot[name]={trades,date:today};
  }
}

async function ensurePerfumeMarket(name){
 const id=Number(DATA.priceIds?.[name]||0);
 if(!id || S.perfumeMarketLoading[name]) return;
 S.perfumeMarketLoading[name]=true;
 const paint=(p)=>{
   if(!p)return false;
   const price=Number(p.last||p.lastSoldPrice||p.min||p.priceMin||p.max||p.priceMax||p.base||p.basePrice||0);
   if(!price)return false;
   S.prices[name]=Object.assign({},S.prices[name]||{},p);
   S.drug[name]=S.prices[name];
   save();
   document.querySelectorAll('[data-perfume-market="'+name+'"] .perfume-current-price').forEach(el=>el.textContent=money(price));
   document.querySelectorAll('[data-perfume-market="'+name+'"] .perfume-sale-price').forEach(el=>el.textContent=money(price));
   document.querySelectorAll('[data-perfume-market="'+name+'"] .perfume-current-stock').forEach(el=>el.textContent=p.stockKnown===true?num(p.currentStock??p.stock??0)+' em estoque':'estoque não confirmado');
   return true;
 };
 try{
   let data=await marketFetch("/item?id="+id+"&refresh=1");
   let p=Array.isArray(data)?data.find(x=>Number(x?.id)===id):null;
   if(!paint(p)){
     data=await marketFetch("/prices?ids="+id+"&refresh=1");
     p=Array.isArray(data)?data.find(x=>Number(x?.id)===id):null;
     paint(p);
   }
 }catch(e){} finally { S.perfumeMarketLoading[name]=false; }
}

}

function qualityVariantName(base,type){return type==='alta'?`${base} de Qualidade Alta`:`${base} Especial`}
function warehouseQualityStock(){return S.warehouseQuality&&typeof S.warehouseQuality==='object'?S.warehouseQuality:{} }
function warehouseQualityEquivalent(initial){
 const stock={...initial}; const q=warehouseQualityStock();

 }
 return stock;
}

function canMakeBatches(recipe,batches,initial){
 const stock={...initial}; const visiting=new Set();
 function need(item,qty){
   qty=Math.max(0,Math.ceil(qty)); if(!qty)return true;
   const have=stock[item]||0; const use=Math.min(have,qty); if(use){stock[item]=have-use;qty-=use}
   if(!qty)return true;
   const r=(RECIPE_DB&&RECIPE_DB[item])||null; if(!r)return false;
   if(visiting.has(item))return false;
   const y=recipeYieldMin(r.yield); const crafts=Math.ceil(qty/y); visiting.add(item);
   for(const [sub,q] of (r.ingredients||[])){if(!need(sub,q*crafts)){visiting.delete(item);return false}}
   visiting.delete(item); const produced=crafts*y; if(produced>qty)stock[item]=(stock[item]||0)+(produced-qty); return true;
 }
 for(const [item,q] of recipe.ingredients){if(!need(item,q*batches))return false} return true;
}
function maxWarehouseBatches(recipe,initial){
 if(!recipe.ingredients.length)return 0; let lo=0,hi=1;
 while(hi<1000000&&canMakeBatches(recipe,hi,initial))hi*=2;
 while(lo+1<hi){const mid=Math.floor((lo+hi)/2);if(canMakeBatches(recipe,mid,initial))lo=mid;else hi=mid} return lo;
}

function gear(){
 let saved={};try{saved=JSON.parse(localStorage.getItem('bdo_lifeskill_gear_v15')||localStorage.getItem('bdo_lifeskill_gear_v5')||'{}')||{}}catch(e){saved={}};
 let activeSkill=saved.skill||'Coleta';if(!MASTERY_SKILLS_V14.includes(activeSkill))activeSkill='Coleta';
 let slots=Object.assign({},GEAR_PRESETS[activeSkill]||{},saved.slots||{});let levels=Object.assign({},saved.levels||{});let lifeLevel=Math.max(0,Math.min(130,Number(saved.lifeLevel??100)));let selectedSlot=saved.selectedSlot||'colar';
 const persist=()=>{const d={skill:activeSkill,slots:{...slots},levels:{...levels},lifeLevel,selectedSlot};try{localStorage.setItem('bdo_lifeskill_gear_v15',JSON.stringify(d));sessionStorage.setItem('bdo_lifeskill_gear_v15',JSON.stringify(d))}catch(e){}};
 const itemByName=n=>GEAR_DATA.find(x=>x.name===n);const allowed=x=>x.skills.includes('TODAS')||x.skills.includes(activeSkill)||(activeSkill==='Cultivo'&&x.skills.includes('Coleta'));
 const accessorySlots=[['colar','Colar','colar'],['brinco1','Brinco 1','brinco'],['brinco2','Brinco 2','brinco'],['anel1','Anel 1','anel'],['anel2','Anel 2','anel'],['cinto','Cinto','cinto']];
 const normalSlots=[['traje','Traje','Trajes'],['ferramenta','Ferramenta','Ferramentas'],['pedra','Pedra / Alquimia','Pedras de Alquimia'],['buff','Buff','Buffs']];
 const artifactSlots=[['artefato1','Artefato 1','Artefatos'],['artefato2','Artefato 2','Artefatos']];
 const slotDef=k=>accessorySlots.find(x=>x[0]===k)||normalSlots.find(x=>x[0]===k)||artifactSlots.find(x=>x[0]===k);
 const levelOptions=(key,item)=>{if(!item)return '';if(item.tier==='Prione')return MASTERY_NAMES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');if(item.tier==='Floramos')return '';if(['Manos','Loggia','Geranoa'].includes(item.tier)&&item.cat==='Acessórios')return MASTERY_NAMES.slice(0,6).map((n,i)=>`<option value="${i}">${n}</option>`).join('');if(['Manos','Loggia','Geranoa','Carta','Gorgath','Roroju','Crio','Srulk','Robeau','Izaro'].includes(item.tier)&&(item.cat==='Trajes'||item.cat==='Ferramentas')){let o='<option value="Base">Base</option>';for(let i=1;i<=15;i++)o+=`<option value="+${i}">+${i}</option>`;for(const n of ['PRI','DUO','TRI','TET','PEN'])o+=`<option value="${n}">${n}</option>`;return o;}return '';};
 const calc=()=>{let g=0;for(const [k,v] of Object.entries(slots)){const it=itemByName(v);if(!it)continue;if(k.startsWith('brinco'))g+=masteryForAccessory(it,'brinco',levels[k]);else if(k.startsWith('anel'))g+=masteryForAccessory(it,'anel',levels[k]);else if(k==='colar')g+=masteryForAccessory(it,'colar',levels[k]);else if(k==='cinto')g+=masteryForAccessory(it,'cinto',levels[k]);else g+=masteryForItem(it,levels[k]);}if(itemByName(slots.pedra)?.name?.startsWith('Coração de Khan'))g+=25;for(let i=1;i<=4;i++){const n=slots['lightstone'+i]||'';if(/Paraíso/i.test(n))g+=5;if(activeSkill==='Coleta'&&/Floresta/i.test(n))g+=5;if(activeSkill==='Pesca'&&/Mordida|Patience/i.test(n))g+=5;if(activeSkill==='Caça'&&/Perseguição|Track/i.test(n))g+=5;if(activeSkill==='Culinária'&&/Mistura|Stir/i.test(n))g+=5;if(activeSkill==='Alquimia'&&/Maleabilidade|Malleable/i.test(n))g+=5;if(activeSkill==='Processamento'&&/Discrição|Deft/i.test(n))g+=5;if(activeSkill==='Treinamento'&&/Puro Sangue|Steed/i.test(n))g+=5;if(activeSkill==='Navegação'&&/Azul|Blue/i.test(n))g+=5;}const base=lifeMasteryFromLevel(lifeLevel);return{base,gear:g,total:base+g};};
 const c=calc();const effect=MASTERY_EFFECTS_V14[activeSkill]||MASTERY_EFFECTS_V14.Coleta;
 const renderSlot=(key,label,type)=>{const item=itemByName(slots[key]);const active=selectedSlot===key?' active':'';const shown=item?(item.tier==='Prione'?(MASTERY_NAMES[Number(levels[key]||0)]||'Base'):(item.tier==='Floramos'?'FIXO':(levels[key]||'Base'))):'';return `<button type="button" class="gSlot s-${key}${active}" data-gslot="${key}" title="Escolher ${esc(label)}"><div class="gHead"><span>${esc(type||label)}</span>${shown?`<span class="gTier">${esc(shown)}</span>`:''}</div><div class="gBody"><div class="gIcon">${item?itemVisual(item):itemFallback({cat:'Acessórios'})}</div><div style="min-width:0"><div class="gName">${item?esc(item.name):'Clique para escolher'}</div><div class="gEffect">${item?esc(item.effect||item.tier||''):esc(label)}</div></div></div></button>`};
 const slotItems=key=>{const d=slotDef(key);if(!d)return[];const type=d[2];if(['colar','brinco','anel','cinto'].includes(type))return GEAR_DATA.filter(x=>accessoryType(x)===type&&(x.cat==='Acessórios'||x.slot==='Acessório'||x.tier==='Prione'||x.tier==='Floramos'));if(type==='Trajes')return GEAR_DATA.filter(x=>x.cat==='Trajes'&&allowed(x));if(type==='Ferramentas')return GEAR_DATA.filter(x=>x.cat==='Ferramentas'&&allowed(x));if(type==='Pedras de Alquimia')return GEAR_DATA.filter(x=>x.cat==='Pedras de Alquimia'&&(x.skills.includes('TODAS')||x.skills.includes(activeSkill)));if(type==='Buffs')return GEAR_DATA.filter(x=>x.cat==='Buffs'&&(x.skills.includes('TODAS')||x.skills.includes(activeSkill)));if(type==='Artefatos')return GEAR_DATA.filter(x=>x.cat==='Artefatos'&&(x.skills.includes('TODAS')||x.skills.includes(activeSkill)));return[]};
 const sortedItems=()=>{let arr=slotItems(selectedSlot);const order={Prione:0,Manos:1,Floramos:2,Geranoa:3,Loggia:4};return arr.sort((a,b)=>(order[a.tier]??5)-(order[b.tier]??5)||a.name.localeCompare(b.name,'pt-BR'))};
 const savedBuilds=()=>{let a=[];try{a=JSON.parse(localStorage.getItem('bdo_lifeskill_saved_gears_v2')||'[]')}catch(e){a=[]}return Array.isArray(a)?a:[]};
 const saveBuild=()=>{const a=savedBuilds();const idx=a.filter(x=>x.skill===activeSkill).length+1;const data={id:Date.now().toString(36),name:`Gear ${activeSkill} ${idx}`,skill:activeSkill,lifeLevel,slots:{...slots},levels:{...levels},total:calc().total,savedAt:new Date().toLocaleString('pt-BR')};a.push(data);try{localStorage.setItem('bdo_lifeskill_saved_gears_v2',JSON.stringify(a));sessionStorage.setItem('bdo_lifeskill_saved_gears_v2',JSON.stringify(a));localStorage.setItem('bdo_lifeskill_gear_v15',JSON.stringify({skill:activeSkill,slots,levels,lifeLevel,selectedSlot}));return data}catch(e){try{sessionStorage.setItem('bdo_lifeskill_saved_gears_v2',JSON.stringify(a));return data}catch(e2){return null}}};
 const picker=()=>{const d=slotDef(selectedSlot),arr=sortedItems(),current=slots[selectedSlot];return `<div class="gPicker"><div class="gPickerHead"><b>Escolher ${esc(d?d[1]:'item')}</b><span class="muted">${arr.length} opções</span></div><div class="gearPickerHint">${esc(activeSkill)} • seleção por slot, como no Gear Planner.</div><input id="gSearch" class="gPickerSearch" placeholder="Pesquisar item..."><div id="gList" class="gPickerList">${arr.map(x=>{const lv=levelOptions(selectedSlot,x),cur=x.name===current;return `<div class="gItem ${cur?'selected':''}" data-gitem="${esc(x.name)}"><div>${itemVisual(x)}</div><div><b>${esc(x.name)}</b><small>${esc(x.tier||'')} • ${esc(x.effect||'')}</small>${lv?`<select data-glevel>${lv}</select>`:'<small style="color:#71e0a0">Nível fixo</small>'}</div></div>`}).join('')||'<div class="muted">Nenhum item cadastrado para este slot.</div>'}</div><div class="gSaved"><div class="gSavedHead"><b>Builds salvas</b><span class="muted">${savedBuilds().length}</span></div><div class="gSavedList">${savedBuilds().map(x=>`<div class="gSavedRow"><span title="${esc(x.name)}">${esc(x.name)} • ${x.total} M</span><button type="button" data-gload="${esc(x.id)}">Carregar</button><button type="button" data-gdel="${esc(x.id)}">×</button></div>`).join('')||'<span class="muted">Nenhuma gear salva.</span>'}</div><div class="gExportBar"><button type="button" id="gExport">Exportar</button><button type="button" id="gImport">Importar</button><input id="gImportFile" type="file" accept="application/json" style="display:none"></div></div></div>`};

 const normalizeImportName=(name)=>String(name||'').trim().replace(/\s+/g,' ');
 const importQuantity=(target,name,qty)=>{const n=normalizeImportName(name);const q=Math.max(0,Math.floor(Number(String(qty??'').replace(/\./g,'').replace(',','.'))||0));if(!n)return false;target[n]=q;return true;};
 const importJson=txt=>{const data=JSON.parse(txt);const wh={};const wq={};let count=0;
   const put=(name,qty,variant)=>{const n=normalizeImportName(name);if(!n)return;const v=String(variant||'').toLowerCase();if(v==='alta'||v.includes('qualidade alta')||v==='alta qualidade'){wq[qualityVariantName(n,'alta')]=Math.max(0,Math.floor(Number(qty)||0));count++;return;}if(v==='especial'){wq[qualityVariantName(n,'especial')]=Math.max(0,Math.floor(Number(qty)||0));count++;return;}importQuantity(wh,n,qty);count++;};
   if(Array.isArray(data)){data.forEach(r=>{if(r&&typeof r==='object')put(r.item??r.nome??r.name,r.quantidade??r.qtd??r.quantity,r.variante??r.variant);});}
   else if(data&&typeof data==='object'){

 const importCsv=txt=>{const lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const wh={};const wq={};if(!lines.length)return {wh,wq,count:0};const split=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++;}else quote=!quote;}else if((c===','||c===';'||c==='\t')&&!quote){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;};const head=split(lines[0]).map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let iName=head.findIndex(x=>['item','nome','produto','produto base'].includes(x));let iQty=head.findIndex(x=>['quantidade','qtd','qtd.','quantity','estoque'].includes(x));let iVar=head.findIndex(x=>['variante','variant','qualidade'].includes(x));let start=1;if(iName<0||iQty<0){iName=0;iQty=1;iVar=2;start=0;}let count=0;for(let i=start;i<lines.length;i++){const r=split(lines[i]);const n=normalizeImportName(r[iName]);const q=Number(String(r[iQty]??'0').replace(/\./g,'').replace(',','.'))||0;const v=String(r[iVar]||'').toLowerCase();if(!n)continue;if(v.includes('alta'))wq[qualityVariantName(n,'alta')]=Math.max(0,Math.floor(q));else if(v.includes('especial'))wq[qualityVariantName(n,'especial')]=Math.max(0,Math.floor(q));else wh[n]=Math.max(0,Math.floor(q));count++;}return {wh,wq,count};};

function masteryCalculator(){
  const skills=['Coleta','Pesca','Caça','Culinária','Alquimia','Processamento','Treinamento','Cultivo','Navegação','Comércio','Permuta'];
  const ranks=[];
  const add=(prefix,max)=>{for(let i=1;i<=max;i++)ranks.push(prefix+' '+i)};
  add('Novato',10); add('Aprendiz',10); add('Hábil',10); add('Profissional',10); add('Artesão',10); add('Mestre',30); add('Guru',50);
  // Índices: B1=0, B2=1 ... G50=129. Curva oficial pós-2022: +10 em B2, +5 até B10, +10 de Aprendiz 1 a Profissional 10 e +5 de Artesão 1 a Guru 50.
  const masteryAt=(idx)=>{
    idx=Math.max(0,Math.min(129,Number(idx)||0));
    if(idx===0)return 0;
    if(idx===1)return 10;
    if(idx<=9)return 10+(idx-1)*5;                 // B2-B10: 10-50
    if(idx<=39)return 60+(idx-10)*10;              // Aprendiz 1-10, Hábil 1-10, Profissional 1-10: 60-350
    if(idx<=79)return 355+(idx-40)*5;              // Artesão 1-10 + Mestre 1-30: 355-550
    return 555+(idx-80)*5;                         // Guru 1-50: 555-800
  };
  const masteryLevelText=(idx)=>`${ranks[idx]} — ${masteryAt(idx)} Maestria`;
  const stored=(()=>{try{return JSON.parse(localStorage.getItem('bdo_mastery_calc_v21')||'{}')||{}}catch(e){return {}}})();
  const state={active:stored.active||'Coleta',levels:Object.assign({},stored.levels||{}),gear:Object.assign({},stored.gear||{}),other:Object.assign({},stored.other||{})};
  skills.forEach(s=>{if(state.levels[s]==null)state.levels[s]=0;if(state.gear[s]==null)state.gear[s]=0;if(state.other[s]==null)state.other[s]=0});
  const save=()=>{try{localStorage.setItem('bdo_mastery_calc_v21',JSON.stringify(state))}catch(e){}};
  const total=s=>Math.min(3000,masteryAt(state.levels[s])+Math.max(0,Number(state.gear[s])||0)+Math.max(0,Number(state.other[s])||0)+buffMasteryTotal());
  const active=state.active||'Coleta';
  const effects={
    'Coleta':'Aumenta a quantidade de recursos básicos e as chances/quantidades de recursos especiais e raros; o efeito escala com a Maestria e possui faixas próprias até 3.000.',

    'Caça':'Aumenta a eficiência da obtenção durante a caça, com efeitos próprios por faixa de Maestria.',
    'Culinária':'Aumenta o rendimento da produção e influencia os resultados específicos da Culinária, conforme as faixas de Maestria.',

    'Processamento':'Aumenta a eficiência/rendimento do Processamento e interage com as mecânicas de produção em massa.',
    'Treinamento':'A Maestria influencia resultados específicos de treinamento, incluindo efeitos ligados a cavalos.',
    'Cultivo':'O Cultivo possui sistemas próprios; o nível pode ser acompanhado aqui, mas bônus que não sejam Maestria não são inventados no cálculo.',
    'Navegação':'A Maestria influencia os atributos/resultados próprios de Navegação conforme as faixas do sistema.',
    'Comércio':'O Comércio possui progressão e efeitos próprios; esta calculadora não soma Maestria de uma categoria que não exista no jogo.',
    'Permuta':'A Permuta possui progressão própria; esta calculadora não cria uma Maestria artificial para ela.'
  };
  const masteryBuffs=[
    {id:'villa',name:'Buff da Barraca / Villa — Descoberta da Vida',group:'villa',mastery:0,exp:'+10% EXP de Vida',note:'Buff de Villa; não dá Maestria, mas pode ficar ativo junto dos demais grupos.',stack:true},
    {id:'florin',name:'Livro Secreto de Florin',group:'masteryScroll',mastery:100,exp:'+20% EXP de Vida',note:'Pergaminho de Maestria. Não combinar com outro item do mesmo grupo.',stack:false},
    {id:'masteryScroll',name:'Pergaminho de Aumento de Maestria de Vida',group:'masteryScroll',mastery:100,exp:'+20% EXP de Vida',note:'Alternativa ao Livro de Florin; escolha apenas um dos dois.',stack:false},
    {id:'giovan',name:'Pergaminho de Suporte de Giovan Grolin',group:'giovan',mastery:100,exp:'+20% EXP de Vida',note:'Pode acumular com os outros buffs de Maestria.',stack:true},
    {id:'stella',name:'Pedra Espiritual de Stella',group:'stella',mastery:100,exp:'Bônus de pedra de vida',note:'Pedra de Espírito; +100 Maestria de Vida enquanto ativa.',stack:true},

" data-mastery-preset="2000">2.000</button><button type="button" data-mastery-preset="2500">2.500</button><button type="button" data-mastery-preset="3000">3.000</button></div><div class="masteryActions" style="margin-top:8px"><button type="button" id="masterySave">💾 Salvar cálculo</button><button type="button" id="masteryReset">↺ Zerar bônus manuais</button></div></div>${buffBlock}<div class="masteryCard" style="margin-top:8px"><h3>Tabela completa — nível × Maestria</h3><div class="masteryTable"><table><tr><th>Nível</th><th>Maestria</th></tr>${refRows}</table></div><div class="masterySource">A curva foi conferida com as notas de atualização da Pearl Abyss e tabelas de referência de Maestria. citeturn0search1turn1search0</div></div></div></div></div>`;

 const cumulative={items:0,value:0};for(const sid of Object.keys(S.spotHistory||{})){for(const h of (S.spotHistory[sid]||[])){cumulative.value+=+h.total||0;cumulative.items+=Object.values(h.items||{}).reduce((a,b)=>a+(+b||0),0)}}
 const style=`<style>.spotGrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;min-width:0}.spotList{display:flex;flex-direction:column;gap:7px;max-height:620px;overflow:auto}.spotBtn{text-align:left;padding:10px 12px;border:1px solid #29415f;background:#101d31;color:#e9f2ff;border-radius:8px;cursor:pointer;display:block;width:100%;position:relative;z-index:2}.spotBtn:hover{border-color:#5b9cff}.spotBtn.on{border-color:#4b91ff;background:#162f52}.spotSummary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.spotMetric{background:#101d31;border:1px solid #29415f;border-radius:8px;padding:10px}.spotMetric b{display:block;font-size:20px;margin-top:3px}.spotActions{display:flex;gap:7px;flex-wrap:wrap}.spotTable{width:100%;table-layout:fixed}.spotTable th,.spotTable td{overflow:hidden;text-overflow:ellipsis}.spotTable input{width:100%;box-sizing:border-box}.spotList .muted{pointer-events:none}.spotItemCount{font-size:10px;color:#8ab4ff;margin-left:5px}@media(max-width:900px){.spotGrid{grid-template-columns:1fr}.spotSummary{grid-template-columns:1fr 1fr}}</style>`;

// Atualização automática robusta: não usa setInterval, pois uma consulta lenta
// poderia se sobrepor à próxima. Cada ciclo só agenda o próximo depois de
// terminar, mantendo preços + estoque do Dashboard sincronizados a cada 5 min.
async function automaticMarketCycle(){
  try{
    const ok=await updateAllMarketPrices(true);
    // O lote principal atualiza preços/estoque e o Dashboard faz uma consulta
    // própria para complementar os estoques em tempo real.
    await loadDashboardMarket();
    if(!ok){
      // Falha temporária: tenta novamente em 60 s sem abandonar o ciclo de 5 min.
      setTimeout(automaticMarketCycle,60000);
      return;
    }
  }catch(e){
    setTimeout(automaticMarketCycle,60000);
    return;
  }
  setTimeout(automaticMarketCycle,5*60*1000);
}
setTimeout(automaticMarketCycle,5*60*1000);

<script id="bdo-server-heartbeat">
(function(){
  const KEY='bdo_harmonia_client_id';
  let clientId='';
  try {
    clientId=sessionStorage.getItem(KEY);
    if(!clientId){
      clientId=(crypto&&crypto.randomUUID)?crypto.randomUUID():('bdo-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      sessionStorage.setItem(KEY,clientId);
    }
  } catch(e) { clientId='bdo-'+Date.now()+'-'+Math.random().toString(36).slice(2); }
  const ping=()=>{
    try{
      fetch('/api/heartbeat?client='+encodeURIComponent(clientId),{cache:'no-store',keepalive:true}).catch(()=>{});
    }catch(e){}
  };
  ping();
  const timer=setInterval(ping,5000);
  window.addEventListener('pagehide',()=>{
    clearInterval(timer);
    // Último ping é uma tentativa de manter o estado atualizado durante
    // navegações; o watchdog é quem confirma que a aba realmente sumiu.
    try{fetch('/api/heartbeat?client='+encodeURIComponent(clientId),{cache:'no-store',keepalive:true}).catch(()=>{});}catch(e){}
  },{once:true});
})();
